appId: ${APP_ID}
name: FL-01 Patient registration and sign-in
# Generated from the wireframes (stories US-001, US-002, US-004, US-005, US-006).
---
- launchApp:
    clearState: true
# SCR-01 Welcome
- assertVisible: "Welcome"
- tapOn: "Continue with mobile number"
# SCR-02 Phone entry
- assertVisible: "Enter your mobile number"
- tapOn: "Send code"
# SCR-03 OTP entry
- assertVisible: "Enter 6-digit code"
- tapOn: "Confirm"
# SCR-04 Patient Home
- assertVisible: "Patient Home"
